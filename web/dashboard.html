<title>Trading Console</title>

<style>
  :root {
    color-scheme: light;
    --plane: #f4f5f7; --surface: #fbfbfc; --ink: #0e1116; --ink-2: #414b57;
    --muted: #5c6672; --hairline: #dde1e7; --accent: #2a78d6;
    --accent-soft: rgba(42,120,214,0.13);
    --good: #0ca30c; --good-ink: #056b05; --critical: #d03b3b; --warning: #b47600;
    --shadow: 0 1px 2px rgba(14,17,22,0.05), 0 8px 24px -12px rgba(14,17,22,0.12);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane: #0d0f12; --surface: #14161a; --ink: #f2f4f7; --ink-2: #b9c1cc;
      --muted: #98a2ae; --hairline: #262a31; --accent: #3987e5;
      --accent-soft: rgba(57,135,229,0.18);
      --good-ink: #34c134; --critical: #e66767; --warning: #fab219;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0f12; --surface: #14161a; --ink: #f2f4f7; --ink-2: #b9c1cc;
    --muted: #98a2ae; --hairline: #262a31; --accent: #3987e5;
    --accent-soft: rgba(57,135,229,0.18);
    --good-ink: #34c134; --critical: #e66767; --warning: #fab219;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--plane); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted); margin: 0;
  }

  header {
    background: var(--surface); border-bottom: 1px solid var(--hairline);
    padding: 16px 24px; position: sticky; top: 0; z-index: 10;
  }
  .head-inner {
    max-width: 1360px; margin: 0 auto; display: flex; gap: 16px;
    align-items: center; justify-content: space-between; flex-wrap: wrap;
  }
  h1 { margin: 2px 0 0; font-size: 18px; font-weight: 620; letter-spacing: -0.01em; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px;
    border-radius: 20px; font-size: 12px; font-weight: 580;
    border: 1px solid var(--hairline);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.live { color: var(--good-ink); }
  .pill.halted { color: var(--critical); }
  .pill.staged { color: var(--warning); }

  main { max-width: 1360px; margin: 0 auto; padding: 22px 24px 64px; }

  .tiles {
    display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px;
    background: var(--hairline); border: 1px solid var(--hairline);
    border-radius: 10px; overflow: hidden; margin-bottom: 20px;
  }
  @media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .tile { background: var(--surface); padding: 13px 15px; }
  .tile dt {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 5px;
  }
  .tile dd { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .pos { color: var(--good-ink); } .neg { color: var(--critical); }
  .warn { color: var(--warning); }
  /* Rationales and health details are prose, not figures: they need to wrap
     rather than force the table into a horizontal scroll. */
  .why { white-space: normal; line-height: 1.45; max-width: 34ch; color: var(--muted); }
  .ok-line { color: var(--good-ink); font-size: 13px; margin: 0; }
  .warn-line { color: var(--warning); font-size: 13px; margin: 0 0 6px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .panel-head {
    padding: 12px 15px; border-bottom: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .panel-head h2 { margin: 0; font-size: 13.5px; font-weight: 620; }
  .panel-body { padding: 15px; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font-family: var(--sans); font-size: 13px; font-weight: 560; cursor: pointer;
    padding: 7px 13px; border-radius: 7px; border: 1px solid var(--hairline);
    background: var(--plane); color: var(--ink);
  }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
  button.danger { color: #fff; background: var(--critical); border-color: transparent; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }

  input[type="password"], input[type="text"] {
    padding: 7px 9px; font-family: var(--sans); font-size: 13px;
    border: 1px solid var(--hairline); border-radius: 7px;
    background: var(--plane); color: var(--ink); min-width: 210px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td {
    text-align: right; padding: 7px 9px; border-bottom: 1px solid var(--hairline);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child { text-align: left; }
  th {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); font-weight: 500;
  }
  tbody tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  .tall { max-height: 300px; overflow-y: auto; }
  .code { font-family: var(--mono); font-size: 11.5px; }
  .empty { color: var(--muted); font-size: 13px; margin: 0; padding: 6px 0; }

  svg.spark { display: block; width: 100%; height: auto; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--hairline);
    box-shadow: var(--shadow); border-radius: 8px; padding: 10px 16px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.15s;
    z-index: 50; max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--critical); color: var(--critical); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div class="head-inner">
    <div>
      <p class="eyebrow">AI Trading Platform</p>
      <h1>Trading console</h1>
    </div>
    <div class="controls">
      <span class="pill" id="mode-pill"><span class="dot"></span><span id="mode-label">…</span></span>
      <span class="pill" id="conn-pill"><span class="dot"></span><span id="conn-label">enter API token</span></span>
      <!--
        Blank means same-origin, which is the case when the platform serves this
        page itself. It is only needed when the dashboard is hosted separately
        (a CDN) from the engine — then it points at the engine's public URL.
      -->
      <input type="text" id="api-base" placeholder="API URL (blank = same origin)" autocomplete="off">
      <input type="password" id="token" placeholder="API token — required to load" autocomplete="off">
      <a class="pill" href="/console">Backtest console →</a>
    </div>
  </div>
</header>

<main>
  <dl class="tiles" id="tiles"></dl>

  <div class="panel">
    <div class="panel-head">
      <h2>Controls</h2>
      <span class="eyebrow">Every route requires the token</span>
    </div>
    <div class="panel-body controls">
      <button type="button" data-mode="MANUAL">Manual</button>
      <button type="button" data-mode="APPROVAL">Approval</button>
      <button type="button" data-mode="AUTOMATIC">Automatic</button>
      <span style="flex:1"></span>
      <button type="button" class="danger" id="kill">Emergency stop</button>
      <button type="button" id="release" hidden>Release stop</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>Equity</h2><span class="eyebrow" id="equity-meta"></span></div>
    <div class="panel-body">
      <svg class="spark" id="equity" viewBox="0 0 900 180" preserveAspectRatio="none"
           role="img" aria-label="Account equity over time"></svg>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-head"><h2>Positions</h2></div>
      <div class="panel-body scroll"><div id="positions"></div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Pending approvals</h2></div>
      <div class="panel-body scroll"><div id="approvals"></div></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-head"><h2>Recent orders</h2></div>
      <div class="panel-body scroll tall"><div id="orders"></div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Closed trades</h2></div>
      <div class="panel-body scroll tall"><div id="trades"></div></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-head">
        <h2>System</h2>
        <span class="eyebrow">Why the loop may not be trading</span>
      </div>
      <div class="panel-body scroll"><div id="health"></div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Broker session</h2>
        <span class="eyebrow" id="session-meta"></span>
      </div>
      <div class="panel-body">
        <div id="session-state"></div>
        <div class="controls" style="margin-top:12px">
          <input id="request-token" type="text" placeholder="request_token from the login redirect"
                 autocomplete="off" spellcheck="false" style="flex:1;min-width:220px" />
          <button type="button" id="submit-token">Set session</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Reconciliation breaks</h2>
      <span class="eyebrow">Platform state vs the broker</span>
    </div>
    <div class="panel-body scroll"><div id="breaks"></div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var money = function (n) {
    var abs = Math.abs(n);
    if (abs >= 1e7) return "₹" + (n / 1e7).toFixed(2) + "cr";
    if (abs >= 1e5) return "₹" + (n / 1e5).toFixed(2) + "L";
    return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 0 });
  };
  var sign = function (n) { return n > 0 ? "pos" : n < 0 ? "neg" : ""; };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  function toast(message, isError) {
    var el = $("toast");
    el.textContent = message;
    el.className = "toast show" + (isError ? " error" : "");
    setTimeout(function () { el.className = "toast"; }, 3200);
  }

  // Where the engine lives.
  //
  // Empty means same origin — the case when the platform serves this page
  // itself. When the dashboard is hosted on a CDN and the engine runs
  // elsewhere, this points at the engine and its origin must appear in the
  // engine's CORS_ORIGINS.
  //
  // localStorage, unlike the token: an endpoint is configuration, not a secret,
  // and retyping it every session would be tedious.
  var apiBase = (localStorage.getItem("apiBase") || "").replace(/\/+$/, "");
  $("api-base").value = apiBase;
  $("api-base").addEventListener("change", function (e) {
    apiBase = e.target.value.trim().replace(/\/+$/, "");
    localStorage.setItem("apiBase", apiBase);
    toast(apiBase ? "API set to " + apiBase : "Using same origin");
    reconnect();
  });

  function api(path) {
    return apiBase + path;
  }

  // The token lives in sessionStorage, not localStorage: it should not
  // outlive the browser session on a shared machine.
  var token = sessionStorage.getItem("apiToken") || "";
  $("token").value = token;
  $("token").addEventListener("change", function (e) {
    token = e.target.value.trim();
    sessionStorage.setItem("apiToken", token);
    toast(token ? "Token saved for this session" : "Token cleared");

    // Load immediately rather than after the next ten-second tick, and open the
    // live socket, which cannot connect until there is a token to present.
    if (token) reconnect();
  });

  // Re-reads against whatever endpoint and token are now set. Used whenever
  // either changes, so the page never sits stale behind a corrected setting.
  function reconnect() {
    refresh();
    if (token && (!socket || socket.readyState > 1)) connect();
  }

  // Reads are authenticated too. They change nothing, but they disclose the
  // position book, the equity curve and the audit log — enough to trade
  // against this account. A 401 is reported as "enter the token" rather than
  // as a generic failure, because that is what it always means here.
  function get(path) {
    var headers = token ? { Authorization: "Bearer " + token } : {};
    return fetch(api(path), { headers: headers }).then(function (r) {
      if (r.status === 401) throw new Error("unauthorised");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function post(path, body) {
    if (!token) {
      toast("Enter the API token first — writes are authenticated", true);
      return Promise.reject(new Error("no token"));
    }
    return fetch(api(path), {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify(body || {}),
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
        return data;
      });
    });
  }

  // ---- rendering --------------------------------------------------------

  function renderStatus(s) {
    var dayPnl = s.realisedPnl + s.unrealisedPnl;
    var tiles = [
      { label: "Equity", value: money(s.equityRupees != null ? s.equityRupees : s.equity / 100) },
      { label: "Cash", value: money(s.cashRupees != null ? s.cashRupees : s.cash / 100) },
      { label: "Unrealised", value: money(s.unrealisedPnl / 100), cls: sign(s.unrealisedPnl) },
      { label: "Realised", value: money(s.realisedPnl / 100), cls: sign(s.realisedPnl) },
      { label: "Open positions", value: String(s.openPositions) },
      { label: "Pending approvals", value: String(s.pendingApprovals) },
      { label: "Loss streak", value: String(s.lossStreak.streak),
        cls: s.lossStreak.trippedAt ? "neg" : "" },
      { label: "Strategy", value: s.strategy },
    ];

    $("tiles").innerHTML = tiles.map(function (t) {
      return '<div class="tile"><dt>' + esc(t.label) + "</dt><dd" +
        (t.cls ? ' class="' + t.cls + '"' : "") + ">" + esc(t.value) + "</dd></div>";
    }).join("");

    var halted = s.killSwitch.engaged;
    var pill = $("mode-pill");
    pill.className = "pill " + (halted ? "halted" : s.mode === "AUTOMATIC" ? "live" : "staged");
    $("mode-label").textContent = halted ? "HALTED — " + s.killSwitch.reason : s.mode;

    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === s.mode));
    });

    $("kill").hidden = halted;
    $("release").hidden = !halted;
  }

  function table(headers, rows, emptyMessage) {
    if (!rows.length) return '<p class="empty">' + esc(emptyMessage) + "</p>";
    return "<table><thead><tr>" +
      headers.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") +
      "</tr></thead><tbody>" + rows.join("") + "</tbody></table>";
  }

  function renderPositions(list) {
    $("positions").innerHTML = table(
      ["Symbol", "Qty", "Avg", "Last", "Unrealised", ""],
      list.map(function (p) {
        // The only exit an operator can start. A strategy's FLAT signal and the
        // square-off are decisions the system makes; this is the one that does
        // not wait for a bar to close.
        return "<tr><td class=\"code\">" + esc(p.symbol) + "</td><td>" + p.quantity +
          "</td><td>" + money(p.averagePriceRupees) + "</td><td>" + money(p.lastPriceRupees) +
          '</td><td class="' + sign(p.unrealisedPnl) + '">' + money(p.unrealisedPnlRupees) +
          '</td><td><button type="button" class="danger" data-flatten="' + esc(p.symbol) +
          '">Close</button></td></tr>';
      }),
      "Flat — no open positions.",
    );
  }

  // How long ago a signal was staged, in words.
  //
  // Age is the first thing to know about an approval: risk is re-checked when
  // you approve, so a stale one will usually be refused, and the queue holds
  // them in the order they arrived rather than dropping them.
  function ago(then) {
    var seconds = Math.max(0, Math.round((Date.now() - then) / 1000));
    if (seconds < 90) return seconds + "s ago";
    var minutes = Math.round(seconds / 60);
    if (minutes < 90) return minutes + "m ago";
    var hours = Math.round(minutes / 60);
    if (hours < 48) return hours + "h ago";
    return Math.round(hours / 24) + "d ago";
  }

  // Beyond this an approval is old enough that the market it was computed
  // against is not the market you would be trading into.
  var STALE_APPROVAL_MS = 15 * 60 * 1000;

  function renderApprovals(list) {
    // Newest first: the actionable ones are the recent ones, and a long queue
    // would otherwise bury them under signals from hours ago.
    var rows = list.slice().sort(function (a, b) { return b.stagedAt - a.stagedAt; });
    var shown = rows.slice(0, 50);

    $("approvals").innerHTML =
      (rows.length > shown.length
        ? '<p class="empty">Showing the 50 most recent of ' + rows.length +
          " staged orders.</p>"
        : "") +
      table(
        ["Symbol", "Side", "Qty", "Why", "Staged", ""],
        shown.map(function (a) {
          // The rationale is the whole reason this row is worth reading:
          // without it an approval is a quantity and a direction with no case
          // attached, and the operator is rubber-stamping rather than deciding.
          var stale = Date.now() - a.stagedAt > STALE_APPROVAL_MS;
          return "<tr><td class=\"code\">" + esc(a.symbol) + "</td><td>" + esc(a.side) +
            "</td><td>" + a.quantity +
            '</td><td style="text-align:left" class="why">' + esc(a.rationale || "—") +
            '</td><td class="' + (stale ? "warn" : "") + '">' + esc(ago(a.stagedAt)) +
            "</td><td>" +
            '<button type="button" data-approve="' + esc(a.idempotencyKey) + '"' +
            (stale ? ' title="Staged a while ago — risk is re-checked on approval"' : "") +
            ">Approve</button> " +
            '<button type="button" data-reject="' + esc(a.idempotencyKey) + '">Reject</button>' +
            "</td></tr>";
        }),
        "Nothing waiting. In Automatic mode orders are not staged.",
      );
  }

  // Health is the answer to "why has nothing traded all morning" — a closed
  // market, an expired calendar, stale data, a broker session needing the daily
  // login, or this instance not holding the lock. None of it is visible from
  // the position book, which looks identical in every one of those cases.
  function renderHealth(report) {
    var order = { unhealthy: 0, degraded: 1, healthy: 2 };
    var checks = report.checks.slice().sort(function (a, b) {
      return (order[a.status] || 3) - (order[b.status] || 3);
    });

    $("health").innerHTML = table(
      ["Check", "Status", "Detail"],
      checks.map(function (c) {
        var cls = c.status === "healthy" ? "pos" : c.status === "unhealthy" ? "neg" : "warn";
        return "<tr><td class=\"code\">" + esc(c.name) + '</td><td class="' + cls + '">' +
          esc(c.status) + '</td><td style="text-align:left" class="why">' + esc(c.detail) +
          "</td></tr>";
      }),
      "No checks reported.",
    );
  }

  function renderSession(s) {
    if (!s.configured) {
      $("session-meta").textContent = "paper broker";
      $("session-state").innerHTML =
        '<p class="empty">No broker session to manage — the paper broker needs no login.</p>';
      $("request-token").disabled = true;
      $("submit-token").disabled = true;
      return;
    }

    $("request-token").disabled = false;
    $("submit-token").disabled = false;

    // Kite tokens expire around 07:30 IST and there is no refresh token, so
    // this is a daily task, not an exceptional one.
    var expiry = s.expiresAt
      ? new Date(s.expiresAt).toISOString().slice(0, 16).replace("T", " ") + " UTC"
      : "unknown";

    $("session-meta").textContent = s.valid ? "valid until " + expiry : "login needed";
    $("session-state").innerHTML = s.valid
      ? '<p class="ok-line">Session is valid. Expires ' + esc(expiry) + ".</p>"
      : '<p class="warn-line">No valid token — the broker will reject orders until you log in.</p>' +
        (s.loginUrl
          ? '<p><a href="' + esc(s.loginUrl) + '" target="_blank" rel="noopener">' +
            "Open the Kite login</a>, then paste the <code>request_token</code> from the " +
            "redirect URL below.</p>"
          : "");
  }

  function renderOrders(list) {
    $("orders").innerHTML = table(
      ["Symbol", "Side", "Qty", "Filled", "Status"],
      list.map(function (o) {
        return "<tr><td class=\"code\">" + esc(o.request.symbol) + "</td><td>" +
          esc(o.request.side) + "</td><td>" + o.request.quantity + "</td><td>" +
          o.filledQuantity + '</td><td class="code">' + esc(o.status) + "</td></tr>";
      }),
      "No orders yet.",
    );
  }

  function renderTrades(list) {
    $("trades").innerHTML = table(
      ["Symbol", "Dir", "Qty", "Net P&L"],
      list.map(function (t) {
        return "<tr><td class=\"code\">" + esc(t.symbol) + "</td><td>" + esc(t.direction) +
          "</td><td>" + t.quantity + '</td><td class="' + sign(t.pnl) + '">' +
          (t.pnl > 0 ? "▲ " : t.pnl < 0 ? "▼ " : "") + money(t.pnlRupees) + "</td></tr>";
      }),
      "No closed trades yet.",
    );
  }

  function renderBreaks(list) {
    $("breaks").innerHTML = table(
      ["Order", "Detail", "Detected"],
      list.map(function (b) {
        return "<tr><td class=\"code\">" + esc(b.orderId || "—") + '</td><td style="text-align:left">' +
          esc(b.detail) + "</td><td>" + new Date(b.detectedAt).toISOString().slice(0, 19).replace("T", " ") +
          "</td></tr>";
      }),
      "None open — platform state agrees with the broker.",
    );
  }

  function renderEquity(curve) {
    var svg = $("equity");
    if (!curve.length) { svg.innerHTML = ""; $("equity-meta").textContent = "no data yet"; return; }

    var W = 900, H = 180, PAD = { l: 58, r: 12, t: 12, b: 20 };
    var lo = Infinity, hi = -Infinity;
    curve.forEach(function (p) { lo = Math.min(lo, p.equity); hi = Math.max(hi, p.equity); });
    var pad = (hi - lo) * 0.08 || Math.max(1, hi * 0.01);
    lo -= pad; hi += pad;

    var n = curve.length;
    var x = function (i) { return PAD.l + (n === 1 ? 0 : (i / (n - 1)) * (W - PAD.l - PAD.r)); };
    var y = function (v) { return PAD.t + (1 - (v - lo) / (hi - lo)) * (H - PAD.t - PAD.b); };

    var line = "";
    curve.forEach(function (p, i) { line += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.equity).toFixed(1) + " "; });
    var area = line + "L" + x(n - 1).toFixed(1) + " " + y(lo) + " L" + PAD.l + " " + y(lo) + " Z";

    var grid = "";
    [lo, (lo + hi) / 2, hi].forEach(function (v) {
      grid += '<line x1="' + PAD.l + '" y1="' + y(v) + '" x2="' + (W - PAD.r) + '" y2="' + y(v) +
        '" stroke="var(--hairline)" stroke-width="1"/>' +
        '<text x="' + (PAD.l - 7) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" ' +
        'font-size="10" fill="var(--muted)">' + money(v) + "</text>";
    });

    svg.innerHTML = grid +
      '<path d="' + area + '" fill="var(--accent-soft)"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" ' +
      'stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + x(n - 1) + '" cy="' + y(curve[n - 1].equity) + '" r="3.5" ' +
      'fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';

    $("equity-meta").textContent = n + " points";
  }

  // ---- actions ----------------------------------------------------------

  Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function (button) {
    button.addEventListener("click", function () {
      post("/api/mode", { mode: button.getAttribute("data-mode"), actor: "dashboard" })
        .then(function (r) { toast("Mode is now " + r.mode); refresh(); })
        .catch(function (e) { toast(e.message, true); });
    });
  });

  $("kill").addEventListener("click", function () {
    var reason = window.prompt("Reason for the emergency stop?", "operator halt");
    if (reason === null) return;
    post("/api/risk/kill-switch", { engaged: true, reason: reason, actor: "dashboard" })
      .then(function () { toast("Emergency stop engaged"); refresh(); })
      .catch(function (e) { toast(e.message, true); });
  });

  $("release").addEventListener("click", function () {
    post("/api/risk/kill-switch", { engaged: false, actor: "dashboard" })
      .then(function () { toast("Stop released"); refresh(); })
      .catch(function (e) { toast(e.message, true); });
  });

  $("positions").addEventListener("click", function (event) {
    var target = event.target;
    var symbol = target.getAttribute && target.getAttribute("data-flatten");
    if (!symbol) return;

    // Confirmed, because it sends a market order against a real position the
    // instant it is clicked, and there is no undo for a fill.
    if (!window.confirm("Close the whole " + symbol + " position at market now?")) return;

    target.disabled = true;
    // Named, so the audit record says who flattened it rather than "api".
    post("/api/positions/" + encodeURIComponent(symbol) + "/flatten", { actor: "dashboard" })
      .then(function (r) {
        toast("Exit sent: " + r.side + " " + r.quantity + " " + r.flattened);
        refresh();
      })
      .catch(function (e) {
        target.disabled = false;
        toast(e.message, true);
      });
  });

  $("submit-token").addEventListener("click", function () {
    var value = $("request-token").value.trim();
    if (!value) return toast("Paste the request_token from the login redirect", true);

    post("/api/broker/session", { requestToken: value, actor: "dashboard" })
      .then(function () {
        $("request-token").value = "";
        toast("Broker session updated — no restart needed");
        refresh();
      })
      .catch(function (e) { toast(e.message, true); });
  });

  $("approvals").addEventListener("click", function (event) {
    var target = event.target;
    var approve = target.getAttribute && target.getAttribute("data-approve");
    var reject = target.getAttribute && target.getAttribute("data-reject");

    if (approve) {
      post("/api/approvals/" + encodeURIComponent(approve) + "/approve", { actor: "dashboard" })
        .then(function () { toast("Order submitted"); refresh(); })
        .catch(function (e) { toast(e.message, true); });
    } else if (reject) {
      post("/api/approvals/" + encodeURIComponent(reject) + "/reject", { reason: "rejected from dashboard" })
        .then(function () { toast("Order rejected"); refresh(); })
        .catch(function (e) { toast(e.message, true); });
    }
  });

  // ---- polling & live socket --------------------------------------------

  function refresh() {
    // Nothing on this page is readable without a token, so say so once rather
    // than failing seven fetches every ten seconds.
    if (!token) {
      $("conn-pill").className = "pill halted";
      $("conn-label").textContent = "enter API token";
      return;
    }

    Promise.all([
      get("/api/status"), get("/api/positions"), get("/api/approvals"),
      get("/api/orders?limit=40"), get("/api/trades?limit=40"),
      get("/api/equity"), get("/api/reconciliation"),
      // /health needs no token and answers with 503 when unhealthy, which `get`
      // treats as a failure — so it is fetched separately below rather than
      // being allowed to fail the whole batch.
      get("/api/broker/session"),
    ]).then(function (r) {
      renderStatus(r[0]);
      renderPositions(r[1].positions);
      renderApprovals(r[2].approvals);
      renderOrders(r[3].orders);
      renderTrades(r[4].trades);
      renderEquity(r[5].curve);
      renderBreaks(r[6].breaks);
      renderSession(r[7]);
    }).catch(function (e) {
      if (e.message === "unauthorised") {
        return toast("Enter the API token to load the dashboard", true);
      }
      // A blocked cross-origin request reaches JS as a bare TypeError with no
      // status, so the browser's own message is useless. Name the likely cause
      // rather than making someone read the console to find it.
      if (apiBase && e instanceof TypeError) {
        return toast(
          "Cannot reach " + apiBase + " — check the URL, and that this origin (" +
          location.origin + ") is in the engine's CORS_ORIGINS", true);
      }
      toast("Refresh failed: " + e.message, true);
    });

    // /health is open and answers 503 when unhealthy, which is a body worth
    // rendering rather than an error to swallow — that is exactly the moment
    // an operator needs to see which check failed.
    fetch(api("/health"))
      .then(function (r) { return r.json(); })
      .then(renderHealth)
      .catch(function () {
        $("health").innerHTML = '<p class="empty">Health endpoint unreachable.</p>';
      });
  }

  var socket = null;

  function connect() {
    // The server refuses the upgrade without a token, so connecting before one
    // is entered would just reconnect in a loop.
    if (!token) return;

    // Derived from the API endpoint, not from this page's location — when the
    // dashboard is on a CDN the socket must reach the engine, not the CDN.
    var origin = apiBase || location.origin;
    var wsOrigin = origin.replace(/^http/, "ws");

    // A token in the query string is the only way to authenticate a websocket:
    // browsers cannot set headers on the handshake.
    var url = wsOrigin + "/ws?token=" + encodeURIComponent(token);

    try {
      socket = new WebSocket(url);
    } catch (e) {
      // A malformed endpoint must not break the page; polling still works.
      return;
    }

    socket.addEventListener("open", function () {
      $("conn-pill").className = "pill live";
      $("conn-label").textContent = "live";
    });
    socket.addEventListener("message", function (event) {
      try {
        var message = JSON.parse(event.data);
        if (message.type === "status") renderStatus(message.payload);
      } catch (e) { /* a malformed frame must not break the stream */ }
    });
    socket.addEventListener("close", function () {
      $("conn-pill").className = "pill halted";
      // A closed socket with no token is a rejected handshake, not a blip;
      // retrying would loop until one is entered.
      $("conn-label").textContent = token ? "reconnecting" : "enter API token";
      if (token) setTimeout(connect, 3000);
    });
    socket.addEventListener("error", function () { socket.close(); });
  }

  refresh();
  setInterval(refresh, 10000);
  connect();
})();
</script>
